name: Update showcase (cloud profile)

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch: {}
  push:
    branches: [main, master]
    paths: ["scripts/**", "ctf/desc.hex", "README.md"]

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}  # latest main, not the stale trigger-time sha
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - name: Render header, architecture, cluster, observability, data center, mesh, deploy log, edge and stack
        working-directory: scripts
        run: |
          python banners.py "${{ github.repository_owner }}" ../assets
          python architecture.py "${{ github.repository_owner }}" ../assets/architecture.svg
          python cluster.py "${{ github.repository_owner }}" ../assets/cluster.svg
          python observe.py "${{ github.repository_owner }}" ../assets/observe.svg
          python datacenter.py "${{ github.repository_owner }}" ../assets/datacenter.svg
          python neural.py "${{ github.repository_owner }}" ../assets/neural.svg
          python deploy.py "${{ github.repository_owner }}" ../assets/deploy.svg
          python edge.py "${{ github.repository_owner }}" ../assets/edge.svg
          python stack.py ../assets/stack.svg
          python explorer.py "${{ github.repository_owner }}" ../README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "showcase-bot"
          git config user.email "showcase-bot@users.noreply.github.com"
          git add assets/ README.md
          git diff --cached --quiet && exit 0
          git commit -m "chore(showcase): rescan"
          git pull --rebase -X theirs -q
          git push
