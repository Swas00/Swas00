name: "🛰️ Add my node to the edge network"
description: "Join the Global Edge on my profile as a satellite node. It stays and keeps orbiting."
title: "[STAR] add my node"
body:
  - type: markdown
    attributes:
      value: |
        Your GitHub handle becomes a glowing node orbiting the globe in my profile's **Global Edge** network, listed in the node registry with a short message.
        One node per person (submit again to change it). Letters, numbers and `! ? ' , -` only; 32 characters max. Abusive messages are filtered out.
  - type: input
    id: message
    attributes:
      label: Message
      description: Up to 32 characters
      placeholder: "hello from Berlin!"
    validations:
      required: true
  - type: dropdown
    id: color
    attributes:
      label: Color
      options:
        - cyan
        - pink
        - gold
        - green
        - violet
    validations:
      required: true
